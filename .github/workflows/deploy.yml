name: Deploy simple-saas

on:
  push:
    branches: [simple-saas]

jobs:
  # ── 1. Lint backend ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "redistribute2.0/Backend/package-lock.json"

      - name: Install backend deps
        working-directory: redistribute2.0/Backend
        run: npm ci

      - name: Install frontend deps
        working-directory: redistribute2.0/Frontend
        run: npm ci

      - name: Lint frontend (tsc --noEmit)
        working-directory: redistribute2.0/Frontend
        run: npx tsc --noEmit

  # ── 2. Run Jest tests ───────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "redistribute2.0/Backend/package-lock.json"

      - name: Install backend deps
        working-directory: redistribute2.0/Backend
        run: npm ci

      - name: Run tests
        working-directory: redistribute2.0/Backend
        run: npm test
        env:
          NODE_ENV: test
          # Tests use mocks — no real secrets needed

  # ── 3. Build frontend ───────────────────────────────────────────────────────
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "redistribute2.0/Frontend/package-lock.json"

      - name: Install frontend deps
        working-directory: redistribute2.0/Frontend
        run: npm ci

      - name: Build
        working-directory: redistribute2.0/Frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: false   # Treat warnings as warnings, not errors

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: redistribute2.0/Frontend/build/
          retention-days: 1

  # ── 4. Deploy frontend to Vercel ────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:   ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:  ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: redistribute2.0/Frontend
          vercel-args: "--prod"

  # ── 5. Deploy backend to Render ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
          | grep -q "^2" && echo "Deploy triggered" || (echo "Deploy hook failed" && exit 1)
